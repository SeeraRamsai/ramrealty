<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100e">
  <meta name="robots" content="noindex">
  <title>Enquiry received | Ram Realty</title>
  <style>
    :root{--ink:#11100e;--cream:#f5f0e6;--muted:#b9b3a8;--gold:#d8b66a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
    main{width:min(620px,calc(100% - 40px));padding:48px 0}
    .brand-logo{position:relative;width:44px;height:34px;overflow:hidden;flex:0 0 auto;background:#080909}.brand-logo img{position:absolute;width:64px;height:64px;max-width:none;left:-10px;top:-9px}
    .kicker{margin:28px 0 8px;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:0;font:400 clamp(38px,7vw,58px)/1.08 Georgia,serif}
    p{color:var(--muted);margin:16px 0 24px}
    .actions{display:flex;flex-wrap:wrap;gap:12px}
    a{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 17px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);text-decoration:none;font-size:14px}
    a.primary{background:var(--gold);color:#17130c}
  </style>
</head>
<body>
  <main>
    <span class="brand-logo" aria-hidden="true"><img src="assets/Ram-realty-logo.png" alt=""></span>
    <p class="kicker">Ram Realty · Visakhapatnam</p>
    <h1>Thanks for getting in touch.</h1>
    <p>Your enquiry has been received. Ram Realty will follow up about the property shown on the form. For a quicker conversation, you can also message Ram Realty on WhatsApp.</p>
    <div class="actions">
      <a class="primary" href="https://wa.me/917799251808?text=Hi%20Ram%20Realty%2C%20I%20just%20submitted%20a%20property%20enquiry." target="_blank" rel="noopener">Continue on WhatsApp ↗</a>
      <a href="/">Back to Ram Realty</a>
    </div>
  </main>
</body>
</html>
