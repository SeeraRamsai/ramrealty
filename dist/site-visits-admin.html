<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#11100e">
  <style data-inline-stylesheet="/assets/site-visit.css">
:root {
  color-scheme: dark;
  --background: #11100e;
  --surface: #1a1814;
  --text: #f5f0e6;
  --muted: #b9b3a8;
  --accent: #d8b66a;
  --line: rgba(216, 182, 106, 0.28);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

a { color: var(--accent); }
button, input, select, textarea { font: inherit; }

.skip-link {
  position: absolute;
  z-index: 5;
  top: -5rem;
  left: 1rem;
  padding: .7rem 1rem;
  background: var(--accent);
  color: var(--background);
}
.skip-link:focus { top: 1rem; }

.site-header, .site-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  padding: 1rem max(5vw, calc((100vw - 1200px) / 2));
  border-bottom: 1px solid var(--line);
}

.site-brand {
  display: inline-flex;
  align-items: center;
  gap: .75rem;
  color: var(--text);
  text-decoration: none;
}
.site-brand img { border-radius: 50%; }
.site-brand span { display: grid; line-height: 1.3; }
.site-brand small { color: var(--muted); }

nav { display: flex; flex-wrap: wrap; gap: 1.1rem; }
nav a, .site-footer a { color: var(--text); text-decoration: none; }
a:hover { color: var(--accent); }

main { width: min(1120px, 90vw); margin: 0 auto; }
.intro { max-width: 760px; padding: 4.5rem 0 2.5rem; }
.eyebrow { color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
h1, h2, p { margin-top: 0; }
h1 { margin-bottom: 1rem; font: 500 clamp(2.4rem, 6vw, 4.2rem)/1.08 Georgia, serif; }
h2 { font: 500 1.55rem/1.25 Georgia, serif; }
.intro > p:last-child { max-width: 650px; color: var(--muted); }

.booking-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(250px, .7fr); gap: 2rem; align-items: start; padding-bottom: 4rem; }
.booking-form, .visit-updates {
  padding: clamp(1.25rem, 3vw, 2rem);
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.booking-form h2 { margin-bottom: 1.5rem; }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1rem; }
.booking-form label { display: grid; gap: .45rem; color: var(--text); font-size: .93rem; font-weight: 600; }
.booking-form input:not([type="checkbox"]), .booking-form select, .booking-form textarea {
  width: 100%;
  min-height: 48px;
  padding: .7rem .8rem;
  border: 1px solid #625b4b;
  border-radius: 6px;
  background: #11100e;
  color: var(--text);
}
.booking-form textarea { resize: vertical; }
.booking-form input:focus, .booking-form select:focus, .booking-form textarea:focus, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.booking-form label small, .form-note, .optional { color: var(--muted); font-size: .83rem; font-weight: 400; }
.wide-field { margin-top: 1.1rem; }
.consent { grid-template-columns: auto 1fr !important; align-items: start; margin: 1.25rem 0; font-weight: 400 !important; }
.consent input { width: 1.1rem; height: 1.1rem; margin: .2rem 0 0; accent-color: var(--accent); }
.booking-form button, .button {
  display: inline-flex;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  padding: .7rem 1.2rem;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: var(--accent);
  color: var(--background);
  cursor: pointer;
  font-weight: 700;
  text-decoration: none;
}
.booking-form button:hover, .button:hover { background: transparent; color: var(--accent); }
.form-note { margin: .9rem 0 0; }
.form-trap { position: absolute; left: -10000px; }

.visit-updates { position: sticky; top: 1rem; }
.visit-updates ol { display: grid; gap: 1.2rem; padding-left: 1.25rem; }
.visit-updates li { padding-left: .3rem; }
.visit-updates li::marker { color: var(--accent); font-weight: 700; }
.visit-updates li strong, .visit-updates li span { display: block; }
.visit-updates li span { margin-top: .2rem; color: var(--muted); font-size: .9rem; }
.contact-help { margin: 1.5rem 0 0; padding-top: 1rem; border-top: 1px solid var(--line); }

.site-footer { justify-content: flex-start; flex-wrap: wrap; border-top: 1px solid var(--line); border-bottom: 0; color: var(--muted); }
.site-footer button, .analytics-choice button { border: 1px solid var(--line); border-radius: 5px; padding: .5rem .75rem; background: transparent; color: var(--text); cursor: pointer; }
.confirmation { max-width: 760px; min-height: 65vh; padding: 5rem 0; }
.confirmation p { color: var(--muted); }
.confirmation .button { margin-top: .75rem; }
.analytics-choice { position: fixed; z-index: 10; right: 1rem; bottom: 1rem; width: min(420px, calc(100vw - 2rem)); padding: 1.25rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 10px 40px #0009; }
.analytics-choice[hidden] { display: none; }
.analytics-choice h2 { margin-bottom: .5rem; }
.analytics-choice p { color: var(--muted); font-size: .9rem; }
.analytics-choice div { display: flex; flex-wrap: wrap; gap: .6rem; }
.admin-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: .9rem; }
.admin-bookings { display: grid; gap: 1rem; padding: 2rem 0 4rem; }
.admin-booking-card { padding: 1.25rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.admin-booking-card h3 { margin: 0 0 .4rem; font: 500 1.25rem Georgia, serif; }
.admin-booking-status { color: var(--accent); }
.admin-booking-card dl { display: grid; grid-template-columns: minmax(110px, .35fr) 1fr; gap: .4rem 1rem; }
.admin-booking-card dt { color: var(--muted); }
.admin-booking-card dd { margin: 0; overflow-wrap: anywhere; }
.admin-error { color: #ffb4a8; }
.booking-form #admin-token { width: 100%; min-height: 48px; margin-top: .5rem; padding: .7rem .8rem; border: 1px solid #625b4b; border-radius: 6px; background: #11100e; color: var(--text); }

@media (max-width: 760px) {
  .site-header { align-items: flex-start; flex-direction: column; padding: 1rem 5vw; }
  nav { gap: .75rem 1rem; }
  .intro { padding-top: 3rem; }
  .booking-layout { grid-template-columns: 1fr; }
  .visit-updates { position: static; }
}
@media (max-width: 520px) {
  .field-grid { grid-template-columns: 1fr; }
  .site-footer { align-items: flex-start; flex-direction: column; gap: .75rem; }
}
</style>
  <title>Manage Site Visits | Ram Realty</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <a class="site-brand" href="/">
      <img src="/assets/ram-realty-logo-small.png" width="48" height="48" alt="">
      <span><strong>RAM REALTY</strong><small>Site-visit management</small></span>
    </a>
    <nav aria-label="Main navigation"><a href="/site-visit.html">Booking page</a><a href="/">Website</a></nav>
  </header>
  <main id="main-content" tabindex="-1">
    <section class="intro">
      <p class="eyebrow">Private staff tool</p>
      <h1>Manage site visits</h1>
      <p>Enter the admin token configured in Netlify. It is used for this page session only and is not saved in browser storage.</p>
    </section>
    <section class="booking-form" aria-labelledby="access-heading">
      <h2 id="access-heading">Admin access</h2>
      <label for="admin-token">Site-visit admin token</label>
      <input id="admin-token" type="password" autocomplete="current-password" required>
      <div class="admin-actions">
        <button id="load-bookings" type="button">Load bookings</button>
        <button id="sign-out" type="button" hidden>Clear token</button>
      </div>
      <p id="admin-status" role="status" aria-live="polite"></p>
    </section>
    <section class="admin-bookings" aria-labelledby="bookings-heading">
      <h2 id="bookings-heading">Saved requests</h2>
      <div id="booking-list" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer">
    <a href="/">Ram Realty</a>
    <a href="/privacy.html">Privacy</a>
  </footer>
  <script src="/assets/site-visits-admin.js?v=1" defer></script>
</body>
</html>
